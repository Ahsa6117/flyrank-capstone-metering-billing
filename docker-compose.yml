# Optional: Postgres instead of the default SQLite.
#
#   docker compose up -d
#   pip install "psycopg[binary]"
#   # then in .env:
#   DATABASE_URL=postgresql+psycopg://billing:billing@localhost:5432/billing
#   python seed.py
#
# The app runs fine WITHOUT Docker — SQLite is the default precisely so that a
# reviewer on a clean machine can start it with one command.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      # Local development credentials only. Never used outside this compose file,
      # and never a real secret.
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  billing_pgdata:
